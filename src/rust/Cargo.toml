[workspace]
resolver = "2"
members = [
  "mcp-server",
  "setup",
  "core",
  "state",
  "contracts",
  "brainstorm",
  "planning",
  "execution",
  "knowledge",
  "deploy",
  "algorithm-client",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/valkor-ai/loom"

[workspace.dependencies]
anyhow = "1.0"
rmcp = { version = "1.7.0", features = ["server", "macros", "schemars", "transport-io"] }
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "io-std", "signal"] }
