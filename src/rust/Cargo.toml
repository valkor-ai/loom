[workspace]
resolver = "2"
members = [
  "mcp-server",
  "setup",
  "core",
  "state",
  "contracts",
  "brainstorm",
  "planning",
  "execution",
  "knowledge",
  "deploy",
  "algorithm-client",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/valkor-ai/loom"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
