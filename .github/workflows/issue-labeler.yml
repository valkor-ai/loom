name: Issue Labeler

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read
  issues: write

jobs:
  label:
    name: Label issue
    runs-on: ubuntu-latest

    steps:
      - name: Apply topic labels
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const text = `${issue.title}\n${issue.body || ""}`.toLowerCase();

            const rules = [
              {
                name: "documentation",
                color: "0075ca",
                description: "Documentation, README, guides, or examples.",
                patterns: [/\bdocs?\b/, /\breadme\b/, /\bdocumentation\b/, /\bguide\b/, /\bexample\b/],
              },
              {
                name: "benchmark",
                color: "f9d0c4",
                description: "Benchmarks, evals, comparisons, or result tracking.",
                patterns: [/\bbenchmark\b/, /\bevals?\b/, /\bcomparison\b/, /\bresults?\b/, /\bswe-bench\b/],
              },
              {
                name: "token-saving",
                color: "5319e7",
                description: "Token usage, compact context, inspect, or read-plan work.",
                patterns: [/\btoken\b/, /\bcompact\b/, /\bcontext\b/, /\binspect\b/, /\bread[- ]?plan\b/],
              },
              {
                name: "adapter",
                color: "c5def5",
                description: "Agent adapters, plugins, or command surfaces.",
                patterns: [/\badapter\b/, /\bplugin\b/, /\bcodex\b/, /\bclaude\b/, /\bopencode\b/, /\bslash command\b/],
              },
              {
                name: "deployment",
                color: "bfdadc",
                description: "Deployment, Docker, Compose, preview, runtime, or environment work.",
                patterns: [/\bdeploy\b/, /\bdocker\b/, /\bcompose\b/, /\bpreview\b/, /\bruntime\b/, /\benv\b/],
              },
              {
                name: "workflow",
                color: "d4c5f9",
                description: "Delivery workflow, routing, planning, review, repair, or handoff.",
                patterns: [/\bworkflow\b/, /\bbrainstorm\b/, /\bplan\b/, /\breview\b/, /\brepair\b/, /\bcontinue\b/, /\bhandoff\b/],
              },
            ];

            const labels = rules.filter((rule) => rule.patterns.some((pattern) => pattern.test(text)));
            if (labels.length === 0) {
              core.info("No topic labels matched.");
              return;
            }

            for (const label of labels) {
              try {
                await github.rest.issues.getLabel({
                  ...context.repo,
                  name: label.name,
                });
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
                try {
                  await github.rest.issues.createLabel({
                    ...context.repo,
                    name: label.name,
                    color: label.color,
                    description: label.description,
                  });
                } catch (createError) {
                  if (createError.status !== 422) {
                    throw createError;
                  }
                }
              }
            }

            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: issue.number,
              labels: labels.map((label) => label.name),
            });
